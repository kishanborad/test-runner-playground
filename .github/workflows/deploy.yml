# .github/workflows/deploy.yml — GitHub Pages deployment
#
# Triggers:
#   - Push to main (automatic deploy)
#   - Manual workflow_dispatch (for on-demand deploys)
#
# Builds the Vite frontend bundle and deploys to GitHub Pages.
# Python artefacts (generated test files, sample reports) are included
# in the dist output for reference.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

# Allow only one deployment at a time; cancel pending deploys if a new push
# arrives before the current deploy finishes.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:

  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: "Build production bundle"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for last-modified dates

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest tests before build
        run: npm test -- --reporter=dot

      - name: Build Vite production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r python/requirements.txt

      - name: Generate sample test report for demo
        run: |
          mkdir -p dist/demo-reports
          # Create a minimal sample result to demonstrate the report builder
          python - <<'PYEOF'
          import json, uuid, pathlib

          run_id = str(uuid.uuid4())[:8]
          report = {
            "run_id": run_id,
            "suite_name": "demo-smoke",
            "target_url": "https://kishanborad.github.io/test-runner-playground",
            "started_at": "2026-07-23T10:00:00.000Z",
            "finished_at": "2026-07-23T10:00:02.450Z",
            "total": 5,
            "passed": 5,
            "failed": 0,
            "duration_ms": 2450.0,
            "pass_rate": 100.0,
            "results": [
              {
                "run_id": run_id,
                "test_id": str(uuid.uuid4()),
                "test_name": "Homepage loads",
                "passed": True,
                "duration_ms": 340.0,
                "start_time": "2026-07-23T10:00:00.000Z",
                "end_time": "2026-07-23T10:00:00.340Z",
                "step_results": [
                  {"step_index": 0, "action": "navigate", "target": "/", "passed": True, "duration_ms": 340.0, "error": None, "screenshot_path": None, "actual_value": "HTTP 200"},
                ],
                "error": None,
                "worker_id": 0,
              },
              {
                "run_id": run_id,
                "test_id": str(uuid.uuid4()),
                "test_name": "Product list visible",
                "passed": True,
                "duration_ms": 510.0,
                "start_time": "2026-07-23T10:00:00.340Z",
                "end_time": "2026-07-23T10:00:00.850Z",
                "step_results": [
                  {"step_index": 0, "action": "navigate", "target": "/", "passed": True, "duration_ms": 340.0, "error": None, "screenshot_path": None, "actual_value": "HTTP 200"},
                  {"step_index": 1, "action": "assert", "target": "Laptop Pro", "passed": True, "duration_ms": 170.0, "error": None, "screenshot_path": None, "actual_value": "contains=True"},
                ],
                "error": None,
                "worker_id": 0,
              },
            ],
          }
          out = pathlib.Path("dist/demo-reports")
          out.mkdir(parents=True, exist_ok=True)
          (out / f"run_{run_id}.json").write_text(json.dumps(report, indent=2))
          print(f"Sample result written: run_{run_id}.json")
          PYEOF

      - name: Generate HTML report from sample data
        run: |
          python python/report_builder.py \
            --results dist/demo-reports \
            --out dist/demo-reports \
            --format html
        continue-on-error: true   # Don't fail deploy if report generation has issues

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ── 2. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"

  # ── 3. Post-deploy smoke check ──────────────────────────────────────────────
  smoke-check:
    name: "Post-deploy smoke check"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run post-deploy HTTP smoke check
        run: |
          python - <<'PYEOF'
          import requests, sys, time

          base_url = "https://KishanBorad.github.io/test-runner-playground"
          checks = [
            ("/", 200, "test-runner-playground"),
            ("/shop.html", 200, None),
          ]

          all_ok = True
          for path, expected_status, contains in checks:
            url = base_url + path
            try:
              resp = requests.get(url, timeout=15)
              status_ok = resp.status_code == expected_status
              content_ok = (contains is None) or (contains.lower() in resp.text.lower())
              if status_ok and content_ok:
                print(f"  ✓  {url} → {resp.status_code}")
              else:
                print(f"  ✗  {url} → {resp.status_code} (expected {expected_status})")
                all_ok = False
            except requests.RequestException as e:
              print(f"  ✗  {url} → ERROR: {e}")
              all_ok = False

          sys.exit(0 if all_ok else 1)
          PYEOF
        continue-on-error: true   # Don't block on smoke check failure
